<style>
/* Motor player styles. Single dark theme by choice: a screening room for points of light.
   Palette from the renders' lighting: warm key (amber, ember), cool rim (moon). */
:root {
  color-scheme: dark;
  --ink: #0a0c12;
  --ink-2: #121724;
  --line: #273047;
  --paper: #ede6dc;
  --paper-2: #c9c0b5;
  --moon: #a9b8d8;
  --clay: #948274;
  --ember: #ff8a4c;
  --amber: #ffc98f;
  --on-amber: #24160a;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --mono: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { background: var(--ink); }
body {
  margin: 0; color: var(--paper); font-family: var(--body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }

/* ---------- stage ---------- */
.stage {
  position: relative; height: 92vh; height: min(92svh, 920px); min-height: 560px;
  overflow: hidden; isolation: isolate;
  background: radial-gradient(110% 75% at 50% 30%, #182036 0%, #0f1320 48%, var(--ink) 100%);
}
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.render-view {
  position: absolute; z-index: 1; left: 0; top: 0; width: 10px; height: 10px; max-width: none;
  opacity: 0; transition: opacity 1.2s ease; pointer-events: none;
  -webkit-mask-image: radial-gradient(circle at 50% 48%, #000 52%, transparent 71%);
  mask-image: radial-gradient(circle at 50% 48%, #000 52%, transparent 71%);
}
.render-view.on { opacity: .92; }
.progress { position: absolute; z-index: 3; left: 0; right: 0; top: 0; height: 2px; background: rgba(169, 184, 216, .16); }
.progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ember), var(--amber)); }
.chapter-card {
  position: absolute; z-index: 3; top: 16px; left: max(16px, 4vw); right: max(16px, 4vw);
  display: grid; gap: 2px; pointer-events: none; transition: opacity .5s ease;
}
.chapter-name { margin: 0; font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.2; color: var(--paper); transition: color 1.2s ease; }
.chapter-card.fresh .chapter-name { color: var(--amber); }

.panel {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: 0;
  padding-inline: max(16px, 5vw); padding-block: 88px 32px;
  background: linear-gradient(180deg, rgba(10, 12, 18, 0) 0%, rgba(10, 12, 18, .8) 34%, rgba(10, 12, 18, .95) 100%);
}
.panel-inner { max-width: 36rem; display: grid; gap: 14px; }
.eyebrow { margin: 0; font-family: var(--mono); font-size: 11px; line-height: 1.5; letter-spacing: .09em; text-transform: uppercase; color: var(--moon); }
.panel h1, .panel h2 {
  margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(44px, 10vw, 84px);
  line-height: .92; letter-spacing: -.025em; text-wrap: balance; color: var(--paper);
}
.lede { margin: 0; max-width: 42ch; font-size: 17px; color: var(--paper-2); }
.pickers { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.picker { border: 0; margin: 0; padding: 0; min-width: 0; }
.picker legend { padding: 0; margin-bottom: 8px; font-size: 15px; color: var(--paper-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; cursor: pointer; }
.chip input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.chip span {
  display: inline-block; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px;
  font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--paper-2);
  transition: border-color .15s, color .15s, background-color .15s;
}
.chip input:checked + span { border-color: var(--amber); color: var(--amber); background: rgba(255, 201, 143, .08); }
.chip input:focus-visible + span { outline: 2px solid var(--paper); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px;
  padding: 13px 22px 13px 18px; background: var(--amber); color: var(--on-amber);
  font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.2; cursor: pointer;
  transition: background-color .15s, transform .15s;
}
.btn:hover { background: #ffd8ad; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
.btn[disabled] { opacity: .7; cursor: progress; }
.btn-ghost { background: transparent; color: var(--paper); border: 1px solid var(--line); padding: 12px 18px; }
.btn-ghost:hover { background: rgba(237, 230, 220, .06); }
.tri { width: 0; height: 0; border-left: 11px solid currentColor; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.quiet-link { color: var(--moon); font-size: 15px; text-decoration: underline; text-decoration-color: rgba(169, 184, 216, .4); text-underline-offset: 4px; }
.quiet-link:hover { color: var(--paper); }
.quiet-link:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; border-radius: 2px; }

.captions {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: 70px;
  padding-inline: max(16px, 6vw); display: flex; justify-content: center; pointer-events: none;
}
.caption {
  margin: 0; max-width: 30ch; text-align: center; font-family: var(--body); font-weight: 700;
  font-size: clamp(20px, 5vw, 31px); line-height: 1.28; text-wrap: balance; color: var(--paper);
  text-shadow: 0 1px 2px rgba(0, 0, 0, .9), 0 4px 24px rgba(0, 0, 0, .75);
  transition: opacity .22s ease, transform .22s ease;
}
.caption.swap { opacity: 0; transform: translateY(6px); }

.transport {
  position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
  padding-inline: max(16px, 4vw); padding-block: 10px 14px; font-family: var(--mono); font-size: 12px; color: var(--moon);
}
.t-btn {
  flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
  background: rgba(18, 23, 36, .75); color: var(--paper); display: grid; place-items: center; cursor: pointer; padding: 0;
}
.t-btn:hover { border-color: var(--moon); }
.t-btn:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
.t-btn[disabled] { opacity: .4; cursor: default; }
.ico { display: block; width: 10px; height: 12px; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
.t-btn.paused .ico {
  width: 0; height: 0; border-right: 0; border-left: 11px solid currentColor;
  border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px;
}
.ico-next {
  position: relative; display: block; width: 0; height: 0; margin-right: 3px;
  border-left: 9px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent;
}
.ico-next::after { content: ""; position: absolute; left: 0; top: -6px; width: 2.5px; height: 12px; background: currentColor; }
.tc { font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-note { font-family: var(--body); font-size: 13px; color: var(--paper-2); }
.chord-wrap { margin-left: auto; white-space: nowrap; }
.chord-label { color: var(--clay); }
.chord { color: var(--amber); font-variant-numeric: tabular-nums; }

/* ---------- liner notes ---------- */
.notes {
  max-width: 1080px; margin-inline: auto; padding-inline: max(16px, 5vw); padding-block: 64px 80px;
  display: grid; gap: 56px;
}
.notes-head { display: grid; gap: 12px; max-width: 62ch; }
.notes h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5.5vw, 48px); line-height: 1; letter-spacing: -.02em; text-wrap: balance; }
.notes-head p:not(.eyebrow) { margin: 0; color: var(--paper-2); }
.credits { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px; }
@media (min-width: 880px) { .credits { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px 40px; } }
.credit { display: grid; gap: 10px; align-content: start; padding-top: 16px; border-top: 1px solid var(--line); }
.label { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ember); }
.credit h3, .plate h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
.credit p, .plate p { margin: 0; color: var(--paper-2); }
.specs { margin: 6px 0 0; display: grid; gap: 7px; }
.specs div { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 12px; align-items: baseline; }
.specs dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--clay); }
.specs dd { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--moon); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.plates { display: grid; gap: 48px; }
.plate { margin: 0; display: grid; gap: 24px; align-items: center; }
@media (min-width: 760px) {
  .plate { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; }
  .plate:nth-child(even) img { order: 2; }
}
.plate img { width: 100%; height: auto; display: block; border-radius: 3px; background: #0b0908; }
.plate figcaption { display: grid; gap: 10px; }
.transcript { display: grid; gap: 10px; max-width: 72ch; }
.transcript > p { margin: 0 0 6px; color: var(--paper-2); }
.tr-chapter { display: grid; gap: 2px; }
.tr-chapter h3 { margin: 22px 0 6px; display: flex; gap: 12px; align-items: baseline; font-family: var(--display); font-weight: 700; font-size: 19px; }
.tr-chapter h3 span { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .08em; color: var(--clay); }
.tr-chapter ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.line-btn {
  display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 14px; align-items: baseline;
  width: calc(100% + 16px); margin-inline: -8px; padding: 6px 8px; border: 0; border-radius: 6px;
  background: transparent; color: var(--paper-2); font: inherit; text-align: left; cursor: pointer;
  transition: background-color .15s, color .3s;
}
.line-btn:hover { background: rgba(169, 184, 216, .07); color: var(--paper); }
.line-btn:focus-visible { outline: 2px solid var(--paper); outline-offset: 1px; }
.line-btn time { font-family: var(--mono); font-size: 12px; color: var(--clay); font-variant-numeric: tabular-nums; }
.line-btn.now { color: var(--amber); }
.colophon { border-top: 1px solid var(--line); padding-top: 18px; max-width: 80ch; font-family: var(--mono); font-size: 11.5px; line-height: 1.75; color: var(--clay); display: grid; gap: 8px; }
.colophon p { margin: 0; }
.colophon a { color: var(--moon); }

@media (prefers-reduced-motion: reduce) {
  .caption, .render-view, .btn, .chip span, .chapter-name, .line-btn { transition: none; }
}

</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="field" aria-hidden="true"></canvas>
  <img id="render-view" class="render-view" alt="" aria-hidden="true">
  <div class="progress" id="progress" hidden><span id="progress-bar"></span></div>
  <div class="chapter-card" id="chapter-card" hidden>
    <p class="eyebrow" id="chapter-num"></p>
    <p class="chapter-name" id="chapter-name"></p>
  </div>

  <section class="panel" id="intro" aria-labelledby="intro-title">
    <div class="panel-inner">
      <p class="eyebrow" id="intro-eyebrow"></p>
      <h1 id="intro-title">Talking Light</h1>
      <p class="lede" id="intro-lede"></p>
      <div class="pickers">
        <fieldset class="picker" id="lang-picker" hidden><legend id="lang-legend"></legend><div class="chips" id="lang-chips"></div></fieldset>
        <fieldset class="picker" id="voice-picker"><legend id="voice-legend"></legend><div class="chips" id="voice-chips"></div></fieldset>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="play"><span class="tri" aria-hidden="true"></span><span id="play-label"></span></button>
        <a class="quiet-link" href="#transcript" id="transcript-link"></a>
      </div>
    </div>
  </section>

  <div class="captions" id="captions" hidden><p class="caption" id="caption" aria-live="polite"></p></div>

  <section class="panel" id="outro" hidden aria-labelledby="outro-title">
    <div class="panel-inner">
      <p class="eyebrow" id="outro-eyebrow"></p>
      <h2 id="outro-title"></h2>
      <p class="lede" id="outro-text"></p>
      <div class="actions">
        <button type="button" class="btn" id="replay"><span class="tri" aria-hidden="true"></span><span id="replay-label"></span></button>
        <button type="button" class="btn btn-ghost" id="swap-voice"></button>
        <button type="button" class="btn btn-ghost" id="swap-lang"></button>
        <a class="quiet-link" href="#notes" id="notes-link"></a>
      </div>
    </div>
  </section>

  <div class="transport" id="transport" hidden>
    <button type="button" class="t-btn" id="pause"><span class="ico" aria-hidden="true"></span></button>
    <button type="button" class="t-btn" id="next"><span class="ico-next" aria-hidden="true"></span></button>
    <span class="tc" id="tc">0:00 / 0:00</span>
    <span class="t-note" id="t-note" hidden></span>
    <span class="chord-wrap"><span class="chord-label" id="chord-label"></span> <span class="chord" id="chord"></span></span>
  </div>
</div>

<main class="notes" id="notes"></main>

    markLine(-1);
    // Keep the last word on screen (re-placed above the outro panel) unless the script names one.
    const word = TX().outro_word;
    applyCue(word ? { type: 'text', value: word } : cue.type === 'text' ? cue : { type: 'text', value: lang === 'es' ? 'fin' : 'the end' }, 0);
    releaseWake();
  }

  function playFrom(from) {
    if (state === 'rest' || state === 'loading' || !actx) { start(from); return; }
    const go = () => {
      if (voiceReady) loadSeg(segAt(Math.max(0, from))).then(() => begin(true, from), () => begin(false, from));
      else begin(false, from);
    };
    if (actx.state !== 'running') actx.resume().then(go, go); else go();
  }
  function nextChapter() {
    if (!tl) return;
    const nt = narrTime();
    const nx = CHAPTERS.find((c) => c.start > nt + 0.6);
    if (nx) playFrom(Math.max(0, nx.start - 0.3));
  }
  async function togglePause() {
    if (!actx) return;
    if (state === 'playing') {
      state = 'paused';
      pauseBtn.classList.add('paused');
      pauseBtn.setAttribute('aria-label', S().resume);
      releaseWake();
      try { await actx.suspend(); } catch (e) { /* ignore */ }
    } else if (state === 'paused') {
      try { await actx.resume(); } catch (e) { /* ignore */ }
      state = 'playing';
      pauseBtn.classList.remove('paused');
      pauseBtn.setAttribute('aria-label', S().pause);
      requestWake();
    }
  }
  let wake = null;
  async function requestWake() {
    try {
      if ('wakeLock' in navigator && !wake) {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (e) { wake = null; }
  }
  function releaseWake() { try { if (wake) wake.release(); } catch (e) { /* ignore */ } wake = null; }

  /* ================= text, pickers and notes ================= */
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const setText = (id, text) => { const e = $(id); if (e) { e.textContent = text || ''; e.hidden = !text; } };
  const otherVoice = () => L().order.find((v) => v !== voice);
  const otherLang = () => SHOW.languages.find((l) => l !== lang);

  function chips(host, name, items, current, onPick) {
    host.textContent = '';
    items.forEach(([value, label]) => {
      const lab = el('label', 'chip');
      const input = el('input');
      input.type = 'radio'; input.name = name; input.id = `${name}-${value}`; input.value = value; input.checked = value === current;
      input.addEventListener('change', () => { if (input.checked) onPick(value); });
      lab.append(input, el('span', null, label));
      host.append(lab);
    });
  }
  function renderIntro() {
    const s = S(), t = TX();
    document.documentElement.lang = lang;
    document.title = t.title;
    setText('intro-eyebrow', t.eyebrow);
    $('intro-title').textContent = t.title;
    setText('intro-lede', t.lede);
    playLabel.textContent = t.play || s.play;
    $('transcript-link').textContent = s.readTranscript;
    const langPicker = $('lang-picker');
    langPicker.hidden = SHOW.languages.length < 2;
    $('lang-legend').textContent = s.language;
    chips($('lang-chips'), 'lang', SHOW.languages.map((l) => [l, LANG_NAMES[l] || l]), lang, setLang);
    $('voice-picker').hidden = L().order.length < 2;
    $('voice-legend').textContent = t.voice_prompt || s.voice;
    chips($('voice-chips'), 'voice', L().order.map((v) => [v, L().voices[v].label]), voice, setVoice);
    pauseBtn.setAttribute('aria-label', s.pause);
    nextBtn.setAttribute('aria-label', s.next);
    $('chord-label').textContent = s.chord;
    tcEl.textContent = `0:00 / ${fmt(V().timeline.duration)}`;
  }
  function renderOutro() {
    const s = S(), t = TX();
    setText('outro-eyebrow', t.outro_eyebrow || s.theEnd);
    $('outro-title').textContent = t.outro_title || s.outroTitle;
    setText('outro-text', t.outro_text);
    $('replay-label').textContent = s.playAgain;
    const ov = otherVoice(), ol = otherLang();
    swapBtn.hidden = !ov;
    if (ov) swapBtn.textContent = fill(s.hearAs, { name: L().voices[ov].label });
    swapLangBtn.hidden = !ol;
    if (ol) swapLangBtn.textContent = LANG_NAMES[ol] || ol;
    $('notes-link').textContent = s.notesLink;
  }
  function renderNotes() {
    const s = S(), t = TX(), host = $('notes');
    host.textContent = '';
    const head = el('header', 'notes-head');
    head.append(el('p', 'eyebrow', s.notesEyebrow), el('h2', null, s.notesTitle));
    if (t.notes) head.append(el('p', null, t.notes));
    host.append(head);

    const spec = (dl, k, v) => { const d = el('div'); d.append(el('dt', null, k), el('dd', null, v)); dl.append(d); return d; };
    const credit = (label, title, text, rows) => {
      const a = el('article', 'credit');
      a.append(el('p', 'label', label), el('h3', null, title), el('p', null, text));
      const dl = el('dl', 'specs');
      rows(dl);
      a.append(dl);
      return a;
    };
    const credits = el('div', 'credits');
    credits.append(credit(s.voiceLabel, s.voiceTitle, fill(s.voiceText, { n: V().timeline.lines.length }), (dl) => {
      spec(dl, s.specModel, 'Kokoro-82M, Apache 2.0');
      spec(dl, s.specVoices, L().order.map((v) => L().voices[v].label).join(' · '));
      spec(dl, s.specLength, L().order.map((v) => fmt(L().voices[v].timeline.duration)).join(' · '));
    }));
    const moods = [...new Set(V().timeline.lines.filter((l) => l.music).map((l) => l.music))];
    credits.append(credit(s.musicLabel, s.musicTitle, s.musicText, (dl) => {
      spec(dl, s.specTempo, '72 BPM');
      moods.forEach((m) => spec(dl, s.moods[m] || m, (MOODS[m] || MOODS.warm).prog.map((c) => c.name).join(' · ')));
    }));
    const cues = V().timeline.lines.reduce((n, l) => n + (l.cue ? 1 : 0) + (l.subcues ? l.subcues.length : 0), 0);
    credits.append(credit(s.lightLabel, s.lightTitle, s.lightText, (dl) => {
      spec(dl, s.specParticles, fill(s.onScreen, { n: N.toLocaleString(lang) })).querySelector('dd').id = 'spec-n';
      spec(dl, s.specCues, fill(s.perPlay, { n: cues }));
      spec(dl, s.specFps, fill(s.fpsLive, { n: Math.round(fpsAvg) })).querySelector('dd').id = 'spec-fps';
    }));
    host.append(credits);

    const keys = Object.keys(SHOW.images || {});
    if (keys.length) {
      const plates = el('div', 'plates');
      keys.forEach((k) => {
        const img = SHOW.images[k], info = (t.images || {})[k] || {};
        const fig = el('figure', 'plate');
        const im = el('img');
        im.src = img.src; im.alt = info.alt || ''; im.loading = 'lazy';
        if (img.w) { im.width = img.w; im.height = img.h; }
        const cap = el('figcaption');
        if (info.title) cap.append(el('h3', null, info.title));
        if (info.caption) cap.append(el('p', null, info.caption));
        fig.append(im, cap);
        plates.append(fig);
      });
      host.append(plates);
    }

    const tr = el('section', 'transcript');
    tr.id = 'transcript';
    tr.append(el('h2', null, s.transcript), el('p', null, s.tapLine));
    let sec = null, ol = null;
    V().timeline.lines.forEach((l, i) => {
      if (l.chapter || !sec) {
        sec = el('section', 'tr-chapter');
        const h = el('h3');
        const ch = CHAPTERS.find((c) => c.idx === i);
        h.append(el('span', null, ch ? `${ch.num} / ${CHAPTERS.length}` : ''), document.createTextNode(l.chapter || ''));
        ol = el('ol');
        sec.append(h, ol);
        tr.append(sec);
      }
      const b = el('button', 'line-btn');
      b.type = 'button';
      b.dataset.i = i;
      const tm = el('time', null, fmt(l.start));
      b.append(tm, el('span', null, l.caption));
      b.addEventListener('click', () => {
        playFrom(Math.max(0, l.start - 0.25));
        stage.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
      });
      const li = el('li');
      li.append(b);
      ol.append(li);
    });
    host.append(tr);

    const foot = el('footer', 'colophon');
    if (t.colophon) foot.append(el('p', null, t.colophon));
    if (SHOW.single) {
      const p = el('p'), a = el('a', null, s.download);
      a.href = SHOW.single; a.setAttribute('download', '');
      p.append(a);
      foot.append(p);
    }
    if (foot.childNodes.length) host.append(foot);
  }
  function renderAll() {
    CHAPTERS = chaptersOf(V().timeline);
    renderIntro();
    renderOutro();
    renderNotes();
  }
  function setVoice(v) {
    voice = v;
    renderAll();
  }
  function setLang(l) {
    lang = l;
    voice = L().order[0];
    renderAll();
    if (state === 'rest') applyCue({ type: 'text', value: TX().idle || (lang === 'es' ? 'hola' : 'hello') }, 0);
  }

  /* ================= loop & wiring ================= */
  let last = 0, fpsAvg = 60;
  function frame(now) {
    requestAnimationFrame(frame);
    const rawDt = now - last;
    last = now;
    const dt = Math.min(3, Math.max(0.2, rawDt / 16.667));
    if (rawDt > 0 && rawDt < 250) fpsAvg += (1000 / rawDt - fpsAvg) * 0.05;
    const t = now / 1000;
    let lv = 0;
    if (ana.node && state === 'playing') {
      ana.node.getFloatTimeDomainData(ana.buf);
      let s = 0;
      for (let i = 0; i < ana.buf.length; i++) s += ana.buf[i] * ana.buf[i];
      lv = Math.min(1, Math.sqrt(s / ana.buf.length) * 5);
    }
    level += (lv - level) * 0.1;
    let ve = 0;
    if (tl && state === 'playing') {
      const nt = narrTime();
      const ch = nt >= 0 ? tl.env.charAt(Math.floor(nt * tl.envFps)) : '';
      if (ch) ve = parseInt(ch, 36) / 35;
      sequence(nt);
    }
    vEnv += (ve - vEnv) * 0.3;
    energy = Math.max(vEnv * 0.85, level * 0.9);
    if (FRAC[cue.type]) dynTargets(t);
    pAlpha += (pAlphaT - pAlpha) * 0.04;
    physics(t, dt);
    draw();
  }

  playBtn.addEventListener('click', () => start());
  replayBtn.addEventListener('click', () => { state = 'ended'; start(); });
  swapBtn.addEventListener('click', () => { const v = otherVoice(); if (v) setVoice(v); state = 'ended'; start(); });
  swapLangBtn.addEventListener('click', () => { const l = otherLang(); if (l) setLang(l); state = 'ended'; start(); });
  pauseBtn.addEventListener('click', togglePause);
  nextBtn.addEventListener('click', nextChapter);
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });
  setInterval(() => { const f = $('spec-fps'); if (f) f.textContent = fill(S().fpsLive, { n: Math.round(fpsAvg) }); }, 1000);

  renderAll();
  cue = { type: 'text', value: TX().idle || (lang === 'es' ? 'hola' : 'hello') };
  resize();
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
  else window.addEventListener('resize', resize);
  const fontsReady = document.fonts && document.fonts.load ? document.fonts.load('800 100px "Bricolage Grotesque"') : Promise.resolve();
  Promise.race([fontsReady, new Promise((r) => setTimeout(r, 2500))]).then(() => { if (cue.type === 'text') applyCue(cue, 0); }, () => {});
  requestAnimationFrame((n) => { last = n; frame(n); });
})();

</script>
</body>
</html>
